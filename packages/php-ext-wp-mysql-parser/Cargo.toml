[package]
name = "wp_mysql_parser"
version = "0.2.0"
edition = "2021"
license = "GPL-2.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = { version = "0.15.12", default-features = false, features = ["runtime"] }
libc = "0.2"
rusqlite = { version = "0.39", default-features = false }
stacker = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
